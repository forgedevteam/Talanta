name: talanta
description: Talanta — Africa's home for talent, culture and community.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  clock: ^1.1.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  image_picker: ^1.2.4
  intl: any
  json_annotation: ^4.12.0
  talanta_api:
    path: ../../packages/api-contract/dart
  talanta_tokens:
    path: ../../packages/design-tokens/dart

dev_dependencies:
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/ClashDisplay-Variable.ttf
